<div class="card">
    <div class="card-header card-header-danger">
        <h4 class="card-title ">Pieces - Liste</h4>
        <p class="card-category">Liste des pieces dans le garage</p>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table">
                <thead class=" text-primary">
                    <th>
                        Nom
                    </th>
                    <th>
                        Description
                    </th>
                    <th>
                        Quantite
                    </th>
                    <th>
                        Prix
                    </th>
                </thead>
                <tbody *ngFor="let piece of pieces">
                    <tr>
                        <td>
                            {{ piece.nom }}
                        </td>
                        <td>
                            {{ piece.description }}
                        </td>
                        <td>
                            {{ piece.quantite }}
                        </td>
                        <td class="text-primary">
                            AR {{ piece.prix }}
                        </td>
                        <td class="td-actions text-right">
                            <button (click)="onEdit(piece.id)" mat-raised-button type="button" matTooltip="Modifier"
                                [matTooltipPosition]="'above'" class="btn btn-primary btn-link btn-sm btn-just-icon">
                                <i class="material-icons">edit</i>
                            </button>
                            <button (click)="onDelete(piece.id)" mat-raised-button type="button" matTooltip="Supprimer"
                                [matTooltipPosition]="'above'" class="btn btn-danger btn-link btn-sm btn-just-icon">
                                <i class="material-icons">close</i>
                            </button>
                            <button (click)="affectToReparation(piece.id)" mat-raised-button type="button"
                                matTooltip="Reparation" [matTooltipPosition]="'above'"
                                class="btn btn-primary btn-link btn-sm btn-just-icon">
                                <i class="material-icons">build</i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
