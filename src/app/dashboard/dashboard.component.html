<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <div class="chart-card">
                <div>Dépenses</div>
                <canvas id="spendingsChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-card">
                <div>Trafic Humain</div>
                <canvas id="humanTrafficChart"></canvas>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-3">
        <div class="col-md-8">
            <div class="chart-card">
                <div>Réparations les plus demandées</div>
                <canvas id="topRepairsChart"></canvas>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <app-list-info [viewOnly]="true"></app-list-info>
        </div>
        
        <div class="col-md-6 d-flex flex-column">
            <div class="stats-card mb-3">
                <div>Nombre d'employés</div>
                <p class="stats-number">{{ employeeCount }}</p>
            </div>
            <div class="stats-card">
                <div>Nombre de clients</div>
                <p class="stats-number">{{ clientCount }}</p>
            </div>
        </div>
    </div>
</div>
