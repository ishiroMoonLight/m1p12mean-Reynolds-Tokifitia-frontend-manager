<div class="card">
    <div class="card-header card-header-danger">
        <h4 class="card-title">Tâches - Création</h4>
        <p class="card-category">Formulaire de création de tâche</p>
    </div>
    <div class="card-body">
        <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="task">Tâche</label>
                <select id="task" class="form-control" formControlName="task">
                    <option *ngFor="let t of tasks" [value]="t.id">{{ t.name }}</option>
                </select>
                <small class="text-danger"
                    *ngIf="taskForm.get('task')?.invalid && taskForm.get('task')?.touched">
                    La tâche est obligatoire.
                </small>
            </div>

            <div class="form-group">
                <label for="startDate">Date de début</label>
                <input type="date" id="startDate" class="form-control" formControlName="startDate">
                <small class="text-danger"
                    *ngIf="taskForm.get('startDate')?.invalid && taskForm.get('startDate')?.touched">
                    La date de début est obligatoire.
                </small>
            </div>

            <div class="form-group">
                <label for="client">Client</label>
                <select id="client" class="form-control" formControlName="client">
                    <option *ngFor="let c of clients" [value]="c.id">{{ c.name }}</option>
                </select>
                <small class="text-danger"
                    *ngIf="taskForm.get('client')?.invalid && taskForm.get('client')?.touched">
                    Le client est obligatoire.
                </small>
            </div>

            <div class="form-group">
                <label for="employee">Employé</label>
                <select id="employee" class="form-control" formControlName="employee">
                    <option *ngFor="let e of employees" [value]="e.id">{{ e.name }}</option>
                </select>
                <small class="text-danger"
                    *ngIf="taskForm.get('employee')?.invalid && taskForm.get('employee')?.touched">
                    L'employé est obligatoire.
                </small>
            </div>

            <button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">Ajouter</button>
        </form>
    </div>
</div>
