<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="card">
                <div class="card-header card-header-danger">
                    <h4 class="card-title">Tâches - Modification</h4>
                    <p class="card-category">Formulaire de modification de tâche</p>
                </div>
                <div class="card-body">
                    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
                        <div class="form-group">
                            <label for="name">Tâche</label>
                            <select id="name" class="form-control" formControlName="name">
                                <option *ngFor="let t of tasks" [value]="t.id">{{ t.name }}</option>
                            </select>
                            <small class="text-danger"
                                *ngIf="editForm.get('name')?.invalid && editForm.get('name')?.touched">
                                La tâche est obligatoire.
                            </small>
                        </div>
            
                        <div class="form-group">
                            <label for="startDate">Date de début</label>
                            <input type="date" id="startDate" class="form-control" formControlName="startDate">
                            <small class="text-danger"
                                *ngIf="editForm.get('startDate')?.invalid && editForm.get('startDate')?.touched">
                                La date de début est obligatoire.
                            </small>
                        </div>
            
                        <div class="form-group">
                            <label for="client">Client</label>
                            <select id="client" class="form-control" formControlName="client">
                                <option *ngFor="let c of clients" [value]="c.id">{{ c.name }}</option>
                            </select>
                            <small class="text-danger"
                                *ngIf="editForm.get('client')?.invalid && editForm.get('client')?.touched">
                                Le client est obligatoire.
                            </small>
                        </div>
            
                        <div class="form-group">
                            <label for="employee">Employé</label>
                            <select id="employee" class="form-control" formControlName="employee">
                                <option *ngFor="let e of employees" [value]="e.id">{{ e.name }}</option>
                            </select>
                            <small class="text-danger"
                                *ngIf="editForm.get('employee')?.invalid && editForm.get('employee')?.touched">
                                L'employé est obligatoire.
                            </small>
                        </div>
            
                        <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid">Ajouter</button>
                    </form>
                </div>
            </div>            
        </div>
    </div>
</div>
