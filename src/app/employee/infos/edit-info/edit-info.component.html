<div class="card">
    <div class="card-header card-header-danger">
        <h4 class="card-title">Employé - Mise à jour</h4>
        <p class="card-category">Formulaire d'édition d'un compte employé</p>
    </div>
    <div class="card-body">
        <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
            <div *ngIf="isLoading" class="text-center">
                <div class="spinner-border" role="status">
                    <span class="sr-only">Chargement...</span>
                </div>
            </div>

            <div *ngIf="!isLoading">
                <div class="form-group">
                    <label for="name">Nom<span class="text-danger">*</span></label>
                    <input type="text" id="name" class="form-control" formControlName="name">
                    <small class="text-danger"
                        *ngIf="employeeForm.get('name')?.invalid && employeeForm.get('name')?.touched">
                        Le nom est obligatoire.
                    </small>
                </div>
    
                <div class="form-group">
                    <label for="firstname">Prénom(s)</label>
                    <input type="text" id="firstname" class="form-control" formControlName="firstname">
                </div>
    
                <div class="form-group">
                    <label for="description">Bio</label>
                    <textarea id="description" class="form-control" formControlName="description"></textarea>
                </div>
    
                <div class="form-group">
                    <button type="button" class="btn btn-secondary" (click)="openFileInput()"><i class="material-icons">cloud_upload</i> Choisir une image (Photo de profil)<span class="text-danger">*</span></button>
                    <input type="file" id="image" class="d-none" (change)="onFileSelected($event)" accept="image/*">
                    <p *ngIf="selectedFile" class="mt-2">Fichier sélectionné : {{ selectedFile.name }}</p>
                    <small class="text-danger"
                        *ngIf="employeeForm.get('image')?.invalid && employeeForm.get('image')?.touched">
                        Une image est obligatoire.
                    </small>
                </div>
    
                <!-- APERÇU DE L'IMAGE -->
                <div *ngIf="imagePreview" class="image-preview">
                    <p>Aperçu :</p>
                    <img [src]="imagePreview" alt="Aperçu de l'image" class="img-thumbnail">
                </div>
    
                <div class="form-group">
                    <label for="salary">Salaire (AR)<span class="text-danger">*</span></label>
                    <input type="number" id="salary" class="form-control" formControlName="salary">
                    <small class="text-danger"
                        *ngIf="employeeForm.get('prix')?.invalid && employeeForm.get('prix')?.touched">
                        Le salaire est obligatoire et doit être un nombre positif.
                    </small>
                </div>
    
                <div class="form-group">
                    <button type="button" class="btn btn-secondary" (click)="onCancel()">
                        Annuler
                    </button>
                    <button type="submit" class="btn btn-primary" [disabled]="employeeForm.invalid">
                        Enregistrer
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
